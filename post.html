<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ลงประกาศ | StudyShare</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">

    <a href="index.html" class="logo">
      📚 StudyShare
    </a>

    <nav class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="books.html">หนังสือ</a>
      <a href="notes.html">ชีทสรุป</a>
      <a href="announcements.html">ประกาศ</a>
      <a href="about.html">เกี่ยวกับระบบ</a>
    </nav>

    <a href="profile.html" class="login-btn">
      โปรไฟล์
    </a>

  </div>
</header>


<main>

<section class="post-section">

  <div class="container">

    <div class="post-header">

      <span class="hero-badge">
        ✨ CREATE POST
      </span>

      <h1>
        ลงประกาศหนังสือ
      </h1>

      <p>
        ส่งต่อหนังสือที่ไม่ได้ใช้แล้ว
        ให้เพื่อนนักเรียน
      </p>

    </div>


    <div class="post-card">

      <form id="postForm">

        <!-- ประเภท -->

        <div class="form-group">

          <label>
            ประเภทสื่อ
          </label>

          <select id="postType" required>

            <option value="book">
              📚 หนังสือ
            </option>

            <option value="note">
              📝 ชีทสรุป
            </option>

          </select>

        </div>


        <!-- ชื่อ -->

        <div class="form-group">

          <label>
            ชื่อหนังสือ / ชื่อชีท
          </label>

          <input
            type="text"
            id="title"
            placeholder="เช่น ตะลุยโจทย์คณิต ม.3"
            required
          >

        </div>


        <!-- วิชา -->

        <div class="form-group">

          <label>
            วิชา
          </label>

          <select id="subject" required>

            <option value="">
              -- เลือกวิชา --
            </option>

            <option value="คณิตศาสตร์">
              คณิตศาสตร์
            </option>

            <option value="วิทยาศาสตร์">
              วิทยาศาสตร์
            </option>

            <option value="ภาษาอังกฤษ">
              ภาษาอังกฤษ
            </option>

            <option value="ภาษาไทย">
              ภาษาไทย
            </option>

            <option value="สังคมศึกษา">
              สังคมศึกษา
            </option>

            <option value="ภาษาจีน">
              ภาษาจีน
            </option>

            <option value="อื่น ๆ">
              อื่น ๆ
            </option>

          </select>

        </div>


        <!-- สภาพ -->

        <div
          class="form-group"
          id="conditionGroup">

          <label>
            สภาพหนังสือ
          </label>

          <select id="condition">

            <option value="ดีมาก">
              ⭐ ดีมาก
            </option>

            <option value="ดี">
              👍 ดี
            </option>

            <option value="พอใช้">
              🙂 พอใช้
            </option>

          </select>

        </div>


        <!-- วิธีแบ่งปัน -->

        <div class="form-group">

          <label>
            ต้องการแบ่งปันแบบไหน?
          </label>

          <select id="shareType" required>

            <option value="free">
              🎁 ให้ฟรี
            </option>

            <option value="sell">
              💰 ขาย
            </option>

            <option value="exchange">
              🔄 แลกเปลี่ยน
            </option>

          </select>

        </div>


        <!-- ราคา -->

        <div
          class="form-group"
          id="priceGroup"
          style="display:none;">

          <label>
            ราคา (บาท)
          </label>

          <input
            type="number"
            id="price"
            min="0"
            placeholder="เช่น 80"
          >

        </div>


        <!-- รายละเอียด -->

        <div class="form-group">

          <label>
            รายละเอียด
          </label>

          <textarea
            id="description"
            rows="5"
            placeholder="เช่น หนังสือมีรอยขีดเขียนเล็กน้อย แต่เนื้อหาครบ..."
            required
          ></textarea>

        </div>


        <!-- ช่องทางติดต่อ -->

        <div class="form-group">

          <label>
            ช่องทางติดต่อ
          </label>

          <input
            type="text"
            id="contact"
            placeholder="เช่น Line: study123"
            required
          >

        </div>


        <button
          type="submit"
          class="btn btn-primary post-submit">

          📢 ลงประกาศ

        </button>


        <p
          id="postMessage"
          class="post-message">
        </p>

      </form>

    </div>

  </div>

</section>

</main>


<footer class="footer">

  <div class="container">

    <div class="footer-logo">
      📚 StudyShare
    </div>

    <p>
      Student Book & Note Sharing System
    </p>

    <div class="footer-line"></div>

    <small>
      © 2026 StudyShare — ระบบแลกเปลี่ยนสื่อการเรียน
    </small>

  </div>

</footer>


<script type="module">

import {
  auth,
  db,
  onAuthStateChanged,
  doc,
  getDoc,
  collection,
  addDoc,
  serverTimestamp
} from "./firebase.js";


const form =
  document.querySelector("#postForm");

const message =
  document.querySelector("#postMessage");

const shareType =
  document.querySelector("#shareType");

const priceGroup =
  document.querySelector("#priceGroup");

const conditionGroup =
  document.querySelector("#conditionGroup");

const postType =
  document.querySelector("#postType");


let currentUser = null;
let currentUserData = null;


// ============================
// ตรวจสอบ Login
// ============================

onAuthStateChanged(auth, async (user) => {

  if (!user) {

    window.location.href =
      "login.html";

    return;
  }


  currentUser = user;


  try {

    const userRef =
      doc(db, "users", user.uid);

    const userSnap =
      await getDoc(userRef);


    if (userSnap.exists()) {

      currentUserData =
        userSnap.data();

    }

  } catch (error) {

    console.error(error);

  }

});


// ============================
// แสดงช่องราคา
// ============================

shareType.addEventListener(
  "change",
  () => {

    if (shareType.value === "sell") {

      priceGroup.style.display =
        "block";

    } else {

      priceGroup.style.display =
        "none";

    }

  }
);


// ============================
// ถ้าเลือกชีท
// ============================

postType.addEventListener(
  "change",
  () => {

    if (postType.value === "note") {

      conditionGroup.style.display =
        "none";

    } else {

      conditionGroup.style.display =
        "block";

    }

  }
);


// ============================
// ลงประกาศ
// ============================

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    if (!currentUser) {

      message.textContent =
        "กรุณาเข้าสู่ระบบก่อน";

      return;
    }


    message.textContent =
      "กำลังบันทึกประกาศ...";


    const type =
      postType.value;

    const title =
      document
        .querySelector("#title")
        .value.trim();

    const subject =
      document
        .querySelector("#subject")
        .value;

    const condition =
      document
        .querySelector("#condition")
        .value;

    const share =
      shareType.value;

    const price =
      document
        .querySelector("#price")
        .value;

    const description =
      document
        .querySelector("#description")
        .value.trim();

    const contact =
      document
        .querySelector("#contact")
        .value.trim();


    try {

      await addDoc(
        collection(db, "posts"),
        {

          type: type,

          title: title,

          subject: subject,

          condition:
            type === "book"
              ? condition
              : "",

          shareType: share,

          price:
            share === "sell"
              ? Number(price || 0)
              : 0,

          description:
            description,

          contact:
            contact,

          ownerId:
            currentUser.uid,

          ownerName:
            currentUserData?.name ||
            "นักเรียน",

          ownerStudentId:
            currentUserData?.studentId ||
            "",

          ownerClass:
            currentUserData?.className ||
            "",

          createdAt:
            serverTimestamp()

        }
      );


      message.textContent =
        "✅ ลงประกาศสำเร็จ!";


      form.reset();


      setTimeout(() => {

        window.location.href =
          type === "book"
            ? "books.html"
            : "notes.html";

      }, 1000);


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ ไม่สามารถบันทึกประกาศได้: " +
        error.message;

    }

  }
);

</script>

</body>
            </html>
