<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>หนังสือ | StudyShare</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
  <div class="container nav-inner">

    <a href="index.html" class="logo">
      📚 StudyShare
    </a>

    <nav class="nav-links">
      <a href="index.html">หน้าแรก</a>
      <a href="books.html">หนังสือ</a>
      <a href="notes.html">ชีทสรุป</a>
      <a href="announcements.html">ประกาศ</a>
      <a href="about.html">เกี่ยวกับระบบ</a>
    </nav>

    <a href="profile.html" class="login-btn">
      โปรไฟล์
    </a>

  </div>
</header>


<main>

<section class="section">

  <div class="container">

    <div class="post-header">

      <span class="hero-badge">
        📚 BOOK MARKET
      </span>

      <h1>
        หนังสือเรียน
      </h1>

      <p>
        ค้นหา แลกเปลี่ยน ซื้อ หรือรับหนังสือจากเพื่อนนักเรียน
      </p>

    </div>


    <!-- SEARCH -->

    <div class="search-box">

      <input
        type="text"
        id="searchBook"
        placeholder="🔎 ค้นหาชื่อหนังสือ วิชา หรือผู้ลงประกาศ...">

    </div>


    <!-- CATEGORY -->

    <div class="category-buttons">

      <button
        class="category-btn active"
        data-category="ทั้งหมด">

        ทั้งหมด

      </button>

      <button
        class="category-btn"
        data-category="คณิตศาสตร์">

        คณิตศาสตร์

      </button>

      <button
        class="category-btn"
        data-category="วิทยาศาสตร์">

        วิทยาศาสตร์

      </button>

      <button
        class="category-btn"
        data-category="ภาษาอังกฤษ">

        ภาษาอังกฤษ

      </button>

      <button
        class="category-btn"
        data-category="ภาษาไทย">

        ภาษาไทย

      </button>

      <button
        class="category-btn"
        data-category="สังคมศึกษา">

        สังคมศึกษา

      </button>

      <button
        class="category-btn"
        data-category="ภาษาจีน">

        ภาษาจีน

      </button>

    </div>


    <div
      id="bookCountText"
      class="result-count">

      กำลังโหลด...

    </div>


    <div
      id="bookGrid"
      class="book-grid">

      กำลังโหลดหนังสือ...

    </div>

  </div>

</section>

</main>


<footer class="footer">

  <div class="container">

    <div class="footer-logo">
      📚 StudyShare
    </div>

    <p>
      Student Book & Note Sharing System
    </p>

  </div>

</footer>


<script type="module">

import {
  db,
  collection,
  getDocs,
  query,
  orderBy
} from "./firebase.js";


const grid =
  document.querySelector("#bookGrid");

const searchInput =
  document.querySelector("#searchBook");

const countText =
  document.querySelector("#bookCountText");

const categoryButtons =
  document.querySelectorAll(".category-btn");


let books = [];

let currentCategory = "ทั้งหมด";


/* =========================
   LOAD
========================= */

async function loadBooks() {

  try {

    const q =
      query(
        collection(db, "posts"),
        orderBy(
          "createdAt",
          "desc"
        )
      );

    const snapshot =
      await getDocs(q);


    books = [];

    snapshot.forEach(
      item => {

        const data =
          item.data();

        if (
          data.type === "book"
        ) {

          books.push({
            id: item.id,
            ...data
          });

        }

      }
    );


    renderBooks();


  } catch (error) {

    console.error(error);

    grid.innerHTML = `
      <div class="loading-card">
        ❌ โหลดหนังสือไม่ได้
        <br><br>
        ${error.message}
      </div>
    `;

  }

}


/* =========================
   RENDER
========================= */

function renderBooks() {

  const keyword =
    searchInput.value
      .trim()
      .toLowerCase();


  const filtered =
    books.filter(book => {

      const categoryOK =
        currentCategory === "ทั้งหมด" ||
        book.subject === currentCategory;


      const text =
        `
        ${book.title || ""}
        ${book.subject || ""}
        ${book.ownerName || ""}
        ${book.description || ""}
        `
        .toLowerCase();


      const searchOK =
        !keyword ||
        text.includes(keyword);


      return categoryOK && searchOK;

    });


  countText.textContent =
    `พบหนังสือ ${filtered.length} รายการ`;


  if (
    filtered.length === 0
  ) {

    grid.innerHTML = `

      <div class="loading-card">

        📭

        <h3>
          ไม่พบหนังสือ
        </h3>

        <p>
          ลองเปลี่ยนคำค้นหาหรือหมวดวิชา
        </p>

      </div>

    `;

    return;

  }


  grid.innerHTML =
    filtered.map(book => {

      const image =
        book.image
          ? `
            <img
              src="${book.image}"
              alt="รูปหนังสือ">
          `
          : `
            <div class="book-cover-empty">
              📚
            </div>
          `;


      const share =
        book.shareType === "free"
          ? "🎁 ให้ฟรี"
          : book.shareType === "exchange"
          ? "🔄 แลกเปลี่ยน"
          : `💰 ${book.price || 0} บาท`;


      const reserved =
        book.status === "reserved"
          ? `
            <div class="reserved-badge">
              🔒 จองแล้ว
            </div>
          `
          : "";


      return `

        <article class="book-card">

          <div class="book-cover">

            ${image}

          </div>

          ${reserved}

          <div class="book-content">

            <span class="book-subject">
              ${book.subject || "ไม่ระบุวิชา"}
            </span>

            <h3>
              ${book.title || "ไม่มีชื่อ"}
            </h3>

            <p>
              ${book.description || "ไม่มีรายละเอียด"}
            </p>

            <div class="book-meta">

              <span>
                👤 ${book.ownerName || "นักเรียน"}
              </span>

              <strong>
                ${share}
              </strong>

            </div>

            <a
              href="post.html?id=${book.id}"
              class="btn btn-primary">

              ดูรายละเอียด

            </a>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  renderBooks
);


/* =========================
   CATEGORY
========================= */

categoryButtons.forEach(
  button => {

    button.addEventListener(
      "click",
      () => {

        categoryButtons.forEach(
          item =>
            item.classList.remove(
              "active"
            )
        );


        button.classList.add(
          "active"
        );


        currentCategory =
          button.dataset.category;


        renderBooks();

      }
    );

  }
);


loadBooks();

</script>

</body>
  </html>
