<script type="module">


import {

  auth,

  db,

  onAuthStateChanged,

  collection,

  addDoc,

  getDocs,

  query,

  where,

  doc,

  getDoc,

  setDoc,

  updateDoc,

  deleteDoc,

  serverTimestamp

} from "./firebase.js";



let currentUser = null;

let currentPost = null;

let editing = false;

let editingId = null;



const params =
  new URLSearchParams(
    window.location.search
  );


const postId =
  params.get("id");



/* =================================
   AUTH
================================= */

onAuthStateChanged(
  auth,
  async (user) => {

    currentUser = user;

    if (postId) {

      await loadPost();

    } else {

      if (!user) {

        window.location.href =
          "login.html";

        return;

      }


      showCreateForm();

    }

  }
);



/* =================================
   LOAD POST
================================= */

async function loadPost() {

  try {

    const postRef =
      doc(
        db,
        "posts",
        postId
      );


    const snap =
      await getDoc(
        postRef
      );


    if (!snap.exists()) {

      alert(
        "ไม่พบประกาศนี้"
      );

      window.location.href =
        "books.html";

      return;

    }


    currentPost = {

      id: snap.id,

      ...snap.data()

    };


    renderPost();


  } catch (error) {

    console.error(error);

    alert(
      "ไม่สามารถโหลดประกาศได้"
    );

  }

}



/* =================================
   RENDER
================================= */

function renderPost() {

  const post =
    currentPost;


  document.title =
    `${post.title || "รายละเอียด"} | StudyShare`;


  document.querySelector(
    "#detailTitle"
  ).textContent =
    post.title || "-";


  document.querySelector(
    "#detailSubject"
  ).textContent =
    post.subject || "ไม่ระบุวิชา";


  document.querySelector(
    "#detailDescription"
  ).textContent =
    post.description ||
    "ไม่มีรายละเอียด";


  document.querySelector(
    "#ownerName"
  ).textContent =
    post.ownerName || "-";


  document.querySelector(
    "#ownerStudent"
  ).textContent =
    `🆔 ${post.ownerStudentId || "-"}`;


  document.querySelector(
    "#ownerClass"
  ).textContent =
    `🏫 ${post.ownerClass || "-"}`;


  document.querySelector(
    "#ownerContact"
  ).textContent =
    post.contact || "-";


  document.querySelector(
    "#detailCondition"
  ).innerHTML = `
    <strong>
      📖 สภาพ
    </strong>

    <p>
      ${post.condition || "ไม่ระบุ"}
    </p>
  `;



  /* ราคา */

  let priceText = "";


  if (
    post.shareType ===
    "free"
  ) {

    priceText =
      "🎁 ให้ฟรี";

  } else if (
    post.shareType ===
    "exchange"
  ) {

    priceText =
      "🔄 แลกเปลี่ยน";

  } else {

    priceText =
      `💰 ${post.price || 0} บาท`;

  }


  document.querySelector(
    "#detailPrice"
  ).textContent =
    priceText;



  /* รูป */

  const imageArea =
    document.querySelector(
      "#detailImage"
    );


  if (post.image) {

    imageArea.innerHTML = `

      <img
        src="${post.image}"
        class="detail-image"
        alt="รูปประกาศ">

    `;

  } else {

    imageArea.innerHTML = `
      📚
    `;

  }



  /* BACK */

  const backLink =
    document.querySelector(
      "#backLink"
    );


  backLink.href =
    post.type === "note"
      ? "notes.html"
      : "books.html";



  /* เจ้าของหรือไม่ */

  const isOwner =
    currentUser &&
    currentUser.uid ===
    post.ownerId;


  if (isOwner) {

    document.querySelector(
      "#ownerActions"
    ).style.display =
      "flex";


    document.querySelector(
      "#buyerActions"
    ).style.display =
      "none";


    document.querySelector(
      "#reservedArea"
    ).style.display =
      post.status === "reserved"
        ? "block"
        : "none";

  } else {

    document.querySelector(
      "#ownerActions"
    ).style.display =
      "none";


    if (
      post.status === "reserved"
    ) {

      /* =================================
         ถูกจองแล้ว
      ================================= */

      document.querySelector(
        "#buyerActions"
      ).style.display =
        "none";


      document.querySelector(
        "#reservedArea"
      ).style.display =
        "block";


    } else {

      document.querySelector(
        "#buyerActions"
      ).style.display =
        "flex";


      document.querySelector(
        "#reservedArea"
      ).style.display =
        "none";

    }

  }

}



/* =================================
   REQUEST
================================= */

async function createRequest(
  requestType
) {

  if (!currentUser) {

    alert(
      "กรุณาเข้าสู่ระบบก่อน"
    );

    window.location.href =
      "login.html";

    return;

  }


  if (!currentPost) {
    return;
  }


  /* เจ้าของห้ามขอตัวเอง */

  if (
    currentUser.uid ===
    currentPost.ownerId
  ) {

    alert(
      "เจ้าของโพสต์ไม่สามารถส่งคำขอให้ตัวเองได้"
    );

    return;

  }


  /* ป้องกันของถูกจอง */

  if (
    currentPost.status ===
    "reserved"
  ) {

    alert(
      "รายการนี้ถูกจองแล้วครับ"
    );

    await loadPost();

    return;

  }


  let typeText = "";


  if (
    requestType === "buy"
  ) {

    typeText =
      "🛒 ขอซื้อ";

  } else if (
    requestType === "free"
  ) {

    typeText =
      "🎁 ขอรับ";

  } else {

    typeText =
      "🔄 ขอแลก";

  }


  const message =
    prompt(
      `${typeText}\n\nฝากข้อความถึงเจ้าของหนังสือได้เลยครับ`
    );


  if (
    message === null
  ) {

    return;

  }


  try {

    /*
      ดึงคำขอของโพสต์นี้
      แล้วตรวจสอบใน JS
      เพื่อลดปัญหา index
    */

    const requestQuery =
      query(
        collection(
          db,
          "requests"
        ),

        where(
          "postId",
          "==",
          currentPost.id
        )
      );


    const requestSnapshot =
      await getDocs(
        requestQuery
      );


    let duplicate =
      false;


    requestSnapshot.forEach(
      item => {

        const data =
          item.data();


        if (
          data.requesterId ===
            currentUser.uid
          &&
          data.status ===
            "pending"
        ) {

          duplicate = true;

        }

      }
    );


    if (duplicate) {

      alert(
        "คุณส่งคำขอรายการนี้ไปแล้ว และกำลังรอเจ้าของตอบครับ"
      );

      return;

    }



    /* โหลดข้อมูลผู้ขอ */

    const userRef =
      doc(
        db,
        "users",
        currentUser.uid
      );


    const userSnap =
      await getDoc(
        userRef
      );


    let userData = {};


    if (
      userSnap.exists()
    ) {

      userData =
        userSnap.data();

    }



    /* สร้าง request */

    await addDoc(
      collection(
        db,
        "requests"
      ),

      {

        postId:
          currentPost.id,

        postTitle:
          currentPost.title || "",

        postType:
          currentPost.type || "book",

        ownerId:
          currentPost.ownerId,

        ownerName:
          currentPost.ownerName || "",

        requesterId:
          currentUser.uid,

        requesterName:
          userData.name ||
          currentUser.displayName ||
          "นักเรียน",

        requesterStudentId:
          userData.studentId ||
          "",

        requesterClass:
          userData.className ||
          "",

        type:
          requestType,

        typeText:
          typeText,

        message:
          message.trim(),

        status:
          "pending",

        createdAt:
          serverTimestamp()

      }

    );


    alert(
      "ส่งคำขอเรียบร้อยแล้ว 💜"
    );


  } catch (error) {

    console.error(error);

    alert(
      "ส่งคำขอไม่สำเร็จ\n" +
      error.message
    );

  }

}



/* =================================
   BUTTONS
================================= */

document.querySelector(
  "#buyButton"
).addEventListener(
  "click",
  () => {

    createRequest(
      "buy"
    );

  }
);


document.querySelector(

document.querySelector(
  "#exchangeButton"

/* =================================
   EDIT
================================= */

document.querySelector(
  "#editButton"
).addEventListener(
  "click",
  () => {

    if (!currentPost) {
      return;
    }


    editing = true;

    editingId =

    document.querySelector(

    document.querySelector(
      "#title"
    ).value =
      currentPost.title || "";


    document.querySelector(
      "#subject"
    ).value =
      currentPost.subject || "";


    document.querySelector(
      "#condition"
    ).value =
      currentPost.condition || "ดี";


    document.querySelector(
      "#shareType"
    ).value =
      currentPost.shareType || "free";


    document.querySelector(
      "#price"
    ).value =
      currentPost.price || 0;


    document.querySelector(
      "#description"
    ).value =
      currentPost.description || "";


    document.querySelector(
      "#contact"
    ).value =
      currentPost.contact || "";


    if (currentPost.image) {

      document.querySelector(
        "#imagePreview"
      ).innerHTML = `

        <img
          src="${currentPost.image}"
          alt="รูปเดิม">

      `;

    }

  }
);



/* =================================
   DELETE
================================= */

document.querySelector(
  "#deleteButton"
).addEventListener(
  "click",
  async () => {

    if (!currentPost) {
      return;
    }


    const confirmDelete =
      confirm(
        "ต้องการลบประกาศนี้ใช่หรือไม่?"
      );


    if (!confirmDelete) {
      return;
    }


    try {

      await deleteDoc(
        doc(
          db,
          "posts",
          currentPost.id
        )
      );


      alert(
        "ลบประกาศเรียบร้อยแล้ว"
      );


      window.location.href =
        currentPost.type === "note"
          ? "notes.html"
          : "books.html";


    } catch (error) {

      console.error(error);

      alert(
        "ลบไม่สำเร็จ\n" +
        error.message
      );

    }

  }
);



/* =================================
   SHOW FORM
================================= */

function showCreateForm() {

  document.querySelector(
    "#detailArea"
  ).style.display =
    "none";


  document.querySelector(
    "#postFormArea"
  ).style.display =
    "block";

}



/* =================================
   IMAGE
================================= */

document.querySelector(
  "#imageInput"
).addEventListener(
  "change",
  async (event) => {

    const file =
      event.target.files[0];


    if (!file) {
      return;
    }


    if (
      !file.type.startsWith(
        "image/"
      )
    ) {

      alert(
        "กรุณาเลือกไฟล์รูปภาพ"
      );

      return;

    }


    try {

      const image =
        await compressImage(
          file
        );


      document.querySelector(
        "#imagePreview"
      ).innerHTML = `

        <img
          src="${image}"
          alt="ตัวอย่างรูป">

      `;


      document.querySelector(
        "#imageInput"
      ).dataset.image =
        image;


    } catch (error) {

      console.error(error);

      alert(
        "ไม่สามารถโหลดรูปได้"
      );

    }

  }
);



/* =================================
   COMPRESS IMAGE
================================= */

function compressImage(
  file
) {

  return new Promise(
    (
      resolve,
      reject
    ) => {

      const reader =
        new FileReader();


      reader.onload =
        event => {

          const img =
            new Image();


          img.onload =
            () => {

              const max =
                700;


              let width =
                img.width;

              let height =
                img.height;


              if (
                width >
                height
              ) {

                if (
                  width > max
                ) {

                  height =
                    height *
                    max /
                    width;

                  width =
                    max;

                }

              } else {

                if (
                  height > max
                ) {

                  width =
                    width *
                    max /
                    height;

                  height =
                    max;

                }

              }


              const canvas =
                document.createElement(
                  "canvas"
                );


              canvas.width =
                width;

              canvas.height =
                height;


              const ctx =
                canvas.getContext(
                  "2d"
                );


              ctx.drawImage(
                img,
                0,
                0,
                width,
                height
              );


              resolve(
                canvas.toDataURL(
                  "image/jpeg",
                  0.65
                )
              );

            };


          img.onerror =
            reject;


          img.src =
            event.target.result;

        };


      reader.onerror =
        reject;


      reader.readAsDataURL(
        file
      );

    }
  );

}



/* =================================
   SAVE POST
================================= */

document.querySelector(
  "#postForm"
).addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    if (!currentUser) {

      alert(
        "กรุณาเข้าสู่ระบบ"
      );

      return;

    }


    try {

      const userRef =
        doc(
          db,
          "users",
          currentUser.uid
        );


      const userSnap =
        await getDoc(
          userRef
        );


      if (
        !userSnap.exists()
      ) {

        alert(
          "ไม่พบข้อมูลนักเรียน"
        );

        return;

      }


      const userData =
        userSnap.data();


      const imageInput =
        document.querySelector(
          "#imageInput"
        );


      let image =
        imageInput.dataset.image ||
        "";


      /*
        ถ้าแก้ไขและไม่ได้เลือกรูปใหม่
        ให้ใช้รูปเดิม
      */

      if (
        editing &&
        !image &&
        currentPost
      ) {

        image =
          currentPost.image || "";

      }


      const postData = {

        type:
          document.querySelector(
            "#postType"
          ).value,

        title:
          document.querySelector(
            "#title"
          ).value.trim(),

        subject:
          document.querySelector(
            "#subject"
          ).value,

        condition:
          document.querySelector(
            "#condition"
          ).value,

        shareType:
          document.querySelector(
            "#shareType"
          ).value,

        price:
          Number(
            document.querySelector(
              "#price"
            ).value
          ) || 0,

        description:
          document.querySelector(
            "#description"
          ).value.trim(),

        contact:
          document.querySelector(
            "#contact"
          ).value.trim(),

        image:
          image,

        ownerId:
          currentUser.uid,

        ownerName:
          userData.name || "",

        ownerStudentId:
          userData.studentId || "",

        ownerClass:
          userData.className || "",

        status:
          editing &&
          currentPost
            ? currentPost.status || "available"
            : "available"

      };


      if (editing) {

        await updateDoc(

          doc(
            db,
            "posts",
            editingId
          ),

          {
            ...postData,
            updatedAt:
              serverTimestamp()
          }

        );


        alert(
          "แก้ไขประกาศเรียบร้อยแล้ว 💜"
        );


      } else {

        await addDoc(

          collection(
            db,
            "posts"
          ),

          {
            ...postData,

            createdAt:
              serverTimestamp()

          }

        );


        alert(
          "ลงประกาศเรียบร้อยแล้ว 🎉"
        );

      }


      window.location.href =
        postData.type === "note"
          ? "notes.html"
          : "books.html";


    } catch (error) {

      console.error(error);

      alert(
        "บันทึกไม่สำเร็จ\n" +
        error.message
      );

    }

  }
);



/* =================================
   CANCEL
================================= */

document.querySelector(
  "#cancelButton"
).addEventListener(
  "click",
  () => {

    if (editing) {

      window.location.href =
        `post.html?id=${editingId}`;

    } else {

      window.location.href =
        "index.html";

    }

  }
);


</script>

</body>
