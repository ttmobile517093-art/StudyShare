<!-- รูป -->  

<div class="detail-photo">  

  <div id="detailImage" class="detail-image">  
    📚  
  </div>  

</div>  


<!-- ข้อมูล -->  

<div class="detail-info">  

  <span id="detailSubject" class="book-subject">  
    -  
  </span>  

  <h1 id="detailTitle">  
    กำลังโหลด...  
  </h1>  

  <div id="detailPrice" class="detail-price">  
  </div>  

  <p id="detailDescription" class="detail-description">  
  </p>  


  <div id="detailCondition" class="owner-box">  
  </div>  


  <!-- เจ้าของ -->  

  <div class="owner-box">  

    <strong>  
      👤 เจ้าของโพสต์  
    </strong>  

    <p id="ownerName">  
      -  
    </p>  

    <p id="ownerStudent">  
      -  
    </p>  

    <p id="ownerClass">  
      -  
    </p>  

  </div>  


  <!-- ติดต่อ -->  

  <div class="contact-box">  

    <strong>  
      📞 ช่องทางติดต่อ  
    </strong>  

    <p id="ownerContact">  
      -  
    </p>  

    <button  
      id="contactButton"  
      type="button"  
      class="btn btn-secondary">  

      💬 ติดต่อเจ้าของ  

    </button>  

  </div>  


  <!-- สถานะ -->  

  <div  
    id="reservedArea"  
    style="display:none;"  
    class="coming-soon">  

    🔒 รายการนี้ถูกจองแล้ว  

    <br>  

    เจ้าของกำลังดำเนินการกับผู้ขอ  

  </div>  


  <!-- ปุ่มคนซื้อ -->  

  <div  
    id="buyerActions"  
    class="buyer-actions">  

    <button  
      id="buyButton"  
      class="btn btn-primary">  

      🛒 ขอซื้อ  

    </button>  

    <button  
      id="freeButton"  
      class="btn btn-secondary">  

      🎁 ขอรับ  

    </button>  

    <button  
      id="exchangeButton"  
      class="btn btn-secondary">  

      🔄 ขอแลก  

    </button>  

  </div>  


  <!-- ปุ่มเจ้าของ -->  

  <div  
    id="ownerActions"  
    class="owner-actions"  
    style="display:none;">  

    <button  
      id="editButton"  
      class="btn btn-primary">  

      ✏️ แก้ไขโพสต์  

    </button>  

    <button  
      id="deleteButton"  
      class="btn btn-danger">  

      🗑️ ลบโพสต์  

    </button>  

  </div>  

</div>  


  
  
    
  
  

<div class="profile-card">  

  <h2 id="formTitle">  
    ลงประกาศ  
  </h2>  

  <form id="postForm">  

    <label>  
      ประเภท  
    </label>  

    <select id="postType" required>  

      <option value="book">  
        📚 หนังสือ  
      </option>  

      <option value="note">  
        📝 ชีทสรุป  
      </option>  

    </select>  


    <label>  
      ชื่อเรื่อง  
    </label>  

    <input  
      type="text"  
      id="title"  
      required  
      placeholder="เช่น หนังสือคณิต ม.3">  


    <label>  
      วิชา  
    </label>  

    <select id="subject" required>  

      <option value="">  
        เลือกวิชา  
      </option>  

      <option value="คณิตศาสตร์">  
        คณิตศาสตร์  
      </option>  

      <option value="วิทยาศาสตร์">  
        วิทยาศาสตร์  
      </option>  

      <option value="ภาษาอังกฤษ">  
        ภาษาอังกฤษ  
      </option>  

      <option value="ภาษาไทย">  
        ภาษาไทย  
      </option>  

      <option value="สังคมศึกษา">  
        สังคมศึกษา  
      </option>  

      <option value="ภาษาจีน">  
        ภาษาจีน  
      </option>  

    </select>  


    <label>  
      สภาพ  
    </label>  

    <select id="condition">  

      <option value="ดีมาก">  
        ดีมาก  
      </option>  

      <option value="ดี">  
        ดี  
      </option>  

      <option value="พอใช้">  
        พอใช้  
      </option>  

    </select>  


    <label>  
      รูปภาพ  
    </label>  

    <input  
      type="file"  
      id="imageInput"  
      accept="image/*">  

    <div  
      id="imagePreview"  
      class="image-preview">  
    </div>  


    <label>  
      รูปแบบการแบ่งปัน  
    </label>  

    <select  
      id="shareType"  
      required>  

      <option value="free">  
        🎁 ให้ฟรี  
      </option>  

      <option value="sell">  
        💰 ขาย  
      </option>  

      <option value="exchange">  
        🔄 แลกเปลี่ยน  
      </option>  

    </select>  


    <label>  
      ราคา  
    </label>  

    <input  
      type="number"  
      id="price"  
      min="0"  
      placeholder="ถ้าให้ฟรีใส่ 0">  


    <label>  
      รายละเอียด  
    </label>  

    <textarea  
      id="description"  
      rows="5"  
      placeholder="รายละเอียดหนังสือหรือชีท"></textarea>  


    <label>  
      ช่องทางติดต่อ  
    </label>  

    <input  
      type="text"  
      id="contact"  
      placeholder="เช่น LINE / ห้องเรียน">  


    <button  
      type="submit"  
      class="btn btn-primary">  

      💾 บันทึกประกาศ  

    </button>  


    <button  
      type="button"  
      id="cancelButton"  
      class="btn btn-secondary">  

      ยกเลิก  

    </button>  

  </form>  

</div>
