<!DOCTYPE html>
<html lang="th">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>หนังสือ | StudyShare</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>


<header class="navbar">

  <div class="container nav-inner">

    <a href="index.html" class="logo">
      📚 StudyShare
    </a>

    <nav class="nav-links">

      <a href="index.html">
        หน้าแรก
      </a>

      <a href="books.html">
        หนังสือ
      </a>

      <a href="notes.html">
        ชีทสรุป
      </a>

      <a href="announcements.html">
        ประกาศ
      </a>

      <a href="about.html">
        เกี่ยวกับระบบ
      </a>

    </nav>

    <a
      href="profile.html"
      class="login-btn">

      โปรไฟล์

    </a>

  </div>

</header>


<main>


<section class="page-hero">

  <div class="container">

    <span class="hero-badge">
      📚 BOOKS
    </span>

    <h1>
      หนังสือเรียนและหนังสือเตรียมสอบ
    </h1>

    <p>
      ค้นหาหนังสือที่เพื่อนนักเรียนนำมาแบ่งปัน
    </p>

  </div>

</section>


<section class="section">

  <div class="container">


    <div class="book-search">

      <input
        type="text"
        id="searchBook"
        placeholder="🔎 ค้นหาชื่อหนังสือหรือวิชา..."
      >

    </div>


    <div class="category-buttons">

      <button
        class="category-btn active"
        data-category="ทั้งหมด">

        ทั้งหมด

      </button>

      <button
        class="category-btn"
        data-category="คณิตศาสตร์">

        คณิตศาสตร์

      </button>

      <button
        class="category-btn"
        data-category="วิทยาศาสตร์">

        วิทยาศาสตร์

      </button>

      <button
        class="category-btn"
        data-category="ภาษาอังกฤษ">

        ภาษาอังกฤษ

      </button>

      <button
        class="category-btn"
        data-category="ภาษาไทย">

        ภาษาไทย

      </button>

    </div>


    <div
      id="bookList"
      class="book-grid">

      <div class="loading-card">
        กำลังโหลดหนังสือ...
      </div>

    </div>


  </div>

</section>


</main>


<footer class="footer">

  <div class="container">

    <div class="footer-logo">
      📚 StudyShare
    </div>

    <p>
      Student Book & Note Sharing System
    </p>

    <div class="footer-line"></div>

    <small>
      © 2026 StudyShare — ระบบแลกเปลี่ยนสื่อการเรียน
    </small>

  </div>

</footer>


<script type="module">

import {
  db,
  collection,
  getDocs,
  query,
  orderBy
} from "./firebase.js";


const bookList =
  document.querySelector("#bookList");

const searchBook =
  document.querySelector("#searchBook");


let books = [];

let currentCategory =
  "ทั้งหมด";


// ============================
// โหลดหนังสือ
// ============================

async function loadBooks() {

  try {

    const q = query(
      collection(db, "posts"),
      orderBy("createdAt", "desc")
    );


    const snapshot =
      await getDocs(q);


    books = [];


    snapshot.forEach((item) => {

      const data =
        item.data();


      if (data.type === "book") {

        books.push({
          id: item.id,
          ...data
        });

      }

    });


    renderBooks();


  } catch (error) {

    console.error(error);


    bookList.innerHTML = `
      <div class="loading-card">
        ไม่สามารถโหลดข้อมูลหนังสือได้
      </div>
    `;

  }

}


// ============================
// แสดงหนังสือ
// ============================

function renderBooks() {

  const keyword =
    searchBook.value
      .trim()
      .toLowerCase();


  const filtered =
    books.filter((book) => {


      const title =
        (book.title || "")
          .toLowerCase();


      const subject =
        (book.subject || "")
          .toLowerCase();


      const matchSearch =
        title.includes(keyword) ||
        subject.includes(keyword);


      const matchCategory =
        currentCategory === "ทั้งหมด" ||
        subject.includes(
          currentCategory.toLowerCase()
        );


      return (
        matchSearch &&
        matchCategory
      );

    });


  if (filtered.length === 0) {

    bookList.innerHTML = `
      <div class="loading-card">

        📚 ยังไม่มีหนังสือที่ตรงกับการค้นหา

      </div>
    `;

    return;

  }


  bookList.innerHTML =
    filtered.map((book) => `

      <div class="book-card">


        <div class="book-cover">

          ${
            book.image
              ? `
                <img
                  src="${book.image}"
                  alt="${book.title || "หนังสือ"}"
                >
              `
              : `
                <span>📚</span>
              `
          }

        </div>


        <div class="book-content">


          <span class="book-subject">

            ${book.subject || "ไม่ระบุวิชา"}

          </span>


          <h3>

            ${book.title || "ไม่มีชื่อหนังสือ"}

          </h3>


          <p>

            ${
              book.description ||
              "ไม่มีรายละเอียด"
            }

          </p>


          <div class="book-owner">

            👤
            ${book.ownerName || "นักเรียน"}

          </div>


          <div class="book-bottom">


            <strong>

              ${
                book.shareType === "free"
                  ? "🎁 ให้ฟรี"
                  : book.shareType === "exchange"
                  ? "🔄 แลกเปลี่ยน"
                  : "💰 " +
                    (
                      book.price || 
                      "สอบถาม"
                    )
              }

            </strong>


            <button
              class="view-book"
              data-id="${book.id}">

              ดูรายละเอียด

            </button>


          </div>


        </div>

      </div>

    `).join("");


  document
    .querySelectorAll(".view-book")
    .forEach((button) => {

      button.addEventListener(
        "click",
        () => {

          window.location.href =
            `post.html?id=${button.dataset.id}`;

        }
      );

    });

}


// ============================
// ค้นหา
// ============================

searchBook.addEventListener(
  "input",
  renderBooks
);


// ============================
// หมวดหมู่
// ============================

document
  .querySelectorAll(".category-btn")
  .forEach((button) => {

    button.addEventListener(
      "click",
      () => {

        document
          .querySelectorAll(".category-btn")
          .forEach((item) =>
            item.classList.remove(
              "active"
            )
          );


        button.classList.add(
          "active"
        );


        currentCategory =
          button.dataset.category;


        renderBooks();

      }
    );

  });


loadBooks();

</script>


</body>
</html>
